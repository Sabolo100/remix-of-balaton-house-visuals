name: Deploy to GitHub Pages

# The viewer needs building, so it cannot be served straight from a branch.
on:
  push:
    branches: [refactor/drawing-viewer]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than dropping a half-published site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx vitest run

      # Project Pages live under /<repo>/, so the assets need that prefix.
      - run: npx vite build --base=/${{ github.event.repository.name }}/

      # The app is a single page; this keeps a stray deep path from 404-ing.
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
